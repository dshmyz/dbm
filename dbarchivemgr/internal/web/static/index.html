<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBArchiveManager 管理后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='5' width='18' height='14' rx='2' fill='%2310b981'/%3E%3Cpath d='M8 11h8M8 15h5' stroke='%23101628' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◧</span>
      <span class="title">DBArchiveManager</span>
      <span class="subtitle">数据库备份归档管控后台</span>
    </div>
    <div class="top-right">
      <span id="user-chip" class="user-chip hidden"></span>
      <button id="logout-btn" class="btn ghost hidden" data-action="logout">退出</button>
      <span id="clock" class="clock"></span>
      <button class="btn ghost" data-action="reload">刷新</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav">
      <button class="nav-item active" data-tab="overview">概览</button>
      <button class="nav-item" data-tab="clusters">集群拓扑</button>
      <button class="nav-item" data-tab="gfs">机房管理</button>
      <button class="nav-item" data-tab="backups">备份元数据</button>
      <button class="nav-item" data-tab="inspects">巡检管理</button>
      <button class="nav-item" data-tab="replenish">补发管理</button>
      <button class="nav-item" data-tab="archive">归档管理</button>
      <button class="nav-item" data-tab="cleanup">GFS 清理</button>
      <button class="nav-item" data-tab="report">备份上报</button>
    </nav>

    <main id="content" class="content">
      <div class="loading">加载中…</div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <input type="file" id="csv-file" accept=".csv" class="hidden" style="display:none" />
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">取消</button>
        <button class="btn danger" id="modal-ok">确认</button>
      </div>
    </div>
  </div>

  <script src="/ui/app.js"></script>
</body>
</html>
